components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: dogfood_session
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Success:
      description: Success envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data: {}
              meta:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details: {}
