openapi: 3.0.3
info:
  title: DOGFOOD 2026 Hackathon Platform API
  version: 1.0.0
  description: 'REST API of the self-hosted DOGFOOD 2026 hackathon platform. All endpoints live under /api. Authenticate with
    the dogfood_session cookie set by /auth/login (the web UI does this) or with the returned JWT as a Bearer token. Every
    response uses the envelope {"success": true, "data": ...} or {"success": false, "error": {"code", "message", "details"}}.
    This file is checked against the live Express routes by backend/tests/api/openapi-coverage.test.ts.'
servers:
- url: /api
  description: Same origin (via the Nginx proxy on :3000 or the backend on :4000)
- url: http://localhost:4000/api
  description: Backend directly
tags:
- name: Audit
- name: Authentication
- name: Certificates
- name: Events
- name: Exports
- name: Gallery
- name: Health
- name: Judging
- name: Media
- name: Pairwise
- name: Results
- name: Submissions
- name: Teams
- name: Tracks & Prizes
- name: Users
- name: Voting
- name: Webhooks
paths:
  /audit-logs:
    get:
      tags:
      - Audit
      summary: Global audit log (paginated)
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ADMIN.'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Default 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Default 50, max 100
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /events/{eventId}/audit-logs:
    get:
      tags:
      - Audit
      summary: Event audit log (paginated)
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Default 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Default 50, max 100
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Log in (sets the session cookie, also returns a JWT)
      description: Public.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out and revoke the session
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: Requires authentication.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Current user profile
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: Requires authentication.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /auth/profile:
    put:
      tags:
      - Authentication
      summary: Update own profile
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                bio:
                  type: string
                avatarUrl:
                  type: string
                  description: http(s) URL or /uploads/<file> path
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Register a participant account (sets the session cookie)
      description: Public.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
                  minLength: 2
                bio:
                  type: string
                role:
                  type: string
                  enum:
                  - PARTICIPANT
                  description: Optional; any other role is rejected. Judges are added by organizers, organizers by admins.
              required:
              - email
              - password
              - name
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
  /certificates/my-certificates:
    get:
      tags:
      - Certificates
      summary: Caller's certificates
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: Requires authentication.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /certificates/verify/{code}:
    get:
      tags:
      - Certificates
      summary: Verify a certificate by its code
      description: Public.
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{eventId}/certificates/generate:
    post:
      tags:
      - Certificates
      summary: Issue HMAC-signed certificates
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - PARTICIPANT
                  - JUDGE
                  - WINNER
                  - ORGANIZER
                  description: WINNER = members of teams ranked 1-3. ORGANIZER currently issues none.
              required:
              - type
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events:
    get:
      tags:
      - Events
      summary: List events
      security:
      - {}
      - CookieAuth: []
      - BearerAuth: []
      description: Authentication optional.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Events
      summary: Create an event (with settings)
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  pattern: ^[a-z0-9-]+$
                  minLength: 3
                  maxLength: 100
                name:
                  type: string
                  minLength: 3
                  maxLength: 255
                tagline:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  minLength: 10
                registrationStartDate:
                  type: string
                  format: date-time
                registrationEndDate:
                  type: string
                  format: date-time
                submissionStartDate:
                  type: string
                  format: date-time
                submissionDeadline:
                  type: string
                  format: date-time
                judgingStartDate:
                  type: string
                  format: date-time
                judgingDeadline:
                  type: string
                  format: date-time
                settings:
                  type: object
                  properties:
                    minTeamSize:
                      type: integer
                      minimum: 1
                    maxTeamSize:
                      type: integer
                      minimum: 1
                      maximum: 20
                    allowCommunityVoting:
                      type: boolean
                    votingEligibility:
                      type: string
                      enum:
                      - PUBLIC
                      - PARTICIPANTS_ONLY
                      - VERIFIED_USERS
                    votesPerUser:
                      type: integer
                      minimum: 1
                    hideResultsUntilPublished:
                      type: boolean
                    randomizeGallery:
                      type: boolean
                    assignmentsPerProject:
                      type: integer
                      minimum: 1
              required:
              - slug
              - name
              - description
              - registrationStartDate
              - registrationEndDate
              - submissionStartDate
              - submissionDeadline
              - judgingStartDate
              - judgingDeadline
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /events/{idOrSlug}:
    get:
      tags:
      - Events
      summary: Get an event by id or slug (includes rubric and tracks)
      security:
      - {}
      - CookieAuth: []
      - BearerAuth: []
      description: Authentication optional.
      parameters:
      - name: idOrSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{id}:
    put:
      tags:
      - Events
      summary: Update an event
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  pattern: ^[a-z0-9-]+$
                  minLength: 3
                  maxLength: 100
                name:
                  type: string
                  minLength: 3
                  maxLength: 255
                tagline:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  minLength: 10
                registrationStartDate:
                  type: string
                  format: date-time
                registrationEndDate:
                  type: string
                  format: date-time
                submissionStartDate:
                  type: string
                  format: date-time
                submissionDeadline:
                  type: string
                  format: date-time
                judgingStartDate:
                  type: string
                  format: date-time
                judgingDeadline:
                  type: string
                  format: date-time
                settings:
                  type: object
                  properties:
                    minTeamSize:
                      type: integer
                      minimum: 1
                    maxTeamSize:
                      type: integer
                      minimum: 1
                      maximum: 20
                    allowCommunityVoting:
                      type: boolean
                    votingEligibility:
                      type: string
                      enum:
                      - PUBLIC
                      - PARTICIPANTS_ONLY
                      - VERIFIED_USERS
                    votesPerUser:
                      type: integer
                      minimum: 1
                    hideResultsUntilPublished:
                      type: boolean
                    randomizeGallery:
                      type: boolean
                    assignmentsPerProject:
                      type: integer
                      minimum: 1
                status:
                  type: string
                  enum:
                  - DRAFT
                  - REGISTRATION_OPEN
                  - SUBMISSION_OPEN
                  - JUDGING_ACTIVE
                  - RESULTS_PUBLISHED
                  - ARCHIVED
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{id}/status:
    patch:
      tags:
      - Events
      summary: Change event status
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - DRAFT
                  - REGISTRATION_OPEN
                  - SUBMISSION_OPEN
                  - JUDGING_ACTIVE
                  - RESULTS_PUBLISHED
                  - ARCHIVED
              required:
              - status
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{eventId}/export/{resource}:
    get:
      tags:
      - Exports
      summary: Alias of the .csv export route
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - name: resource
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: CSV file (RFC 4180, formula cells neutralized)
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{eventId}/export/{resource}.csv:
    get:
      tags:
      - Exports
      summary: Download a CSV export (participants, teams, projects, scores, results)
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - name: resource
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: CSV file (RFC 4180, formula cells neutralized)
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{eventId}/exports/csv/{resource}:
    get:
      tags:
      - Exports
      summary: Alias of the .csv export route
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - name: resource
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: CSV file (RFC 4180, formula cells neutralized)
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{eventId}/import/bulk:
    post:
      tags:
      - Exports
      summary: Bulk-import users (validate with dryRun first)
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - name: dryRun
        in: query
        required: false
        schema:
          type: boolean
        description: Alternative to the body flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  description: Validate only; nothing is written
                users:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum:
                        - PARTICIPANT
                        - JUDGE
                        - ORGANIZER
                        description: ORGANIZER only when the caller is ADMIN
                      password:
                        type: string
                        minLength: 8
                        description: Omit to generate a random temporary password (returned once)
                    required:
                    - name
                    - email
                  maxItems: 200
              required:
              - users
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{eventId}/gallery:
    get:
      tags:
      - Gallery
      summary: Public gallery of submitted projects (search, track filter, pagination)
      description: Public.
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive match on title, tagline, problem, solution; exact technology match
      - name: trackId
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: title | date | randomized
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Default 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Default 12, max 50
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /health:
    get:
      tags:
      - Health
      summary: Health check
      description: Public.
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /assignments/{assignmentId}:
    delete:
      tags:
      - Judging
      summary: Remove an assignment
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /evaluations:
    post:
      tags:
      - Judging
      summary: Submit or update an evaluation (assigned judge, within the judging window)
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: JUDGE, ORGANIZER, ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
                projectId:
                  type: string
                isDraft:
                  type: boolean
                feedback:
                  type: string
                  maxLength: 10000
                scores:
                  type: array
                  items:
                    type: object
                    properties:
                      criterionId:
                        type: string
                      score:
                        type: number
                        description: 0..criterion.maxScore
                    required:
                    - criterionId
                    - score
              required:
              - eventId
              - projectId
              - scores
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /evaluations/project/{projectId}:
    get:
      tags:
      - Judging
      summary: Caller's evaluation of a project
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: Requires authentication.
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{eventId}/judges:
    get:
      tags:
      - Judging
      summary: List judges
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Judging
      summary: Add a registered user as judge
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Must belong to a registered user; participants are promoted to JUDGE
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 1000
              required:
              - email
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{eventId}/judges/assign/auto:
    post:
      tags:
      - Judging
      summary: Deterministic auto-assignment (Mulberry32 seed, conflict-of-interest aware)
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seed:
                  type: integer
                  description: Mulberry32 seed (default 42)
                targetPerProject:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: Judges per project (default 3)
                clearExisting:
                  type: boolean
                  description: Replace existing assignments (default true)
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /events/{eventId}/judges/assign/manual:
    post:
      tags:
      - Judging
