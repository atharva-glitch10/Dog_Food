      tags:
      - Webhooks
      summary: Create a webhook subscription (secret returned once)
      security:
      - CookieAuth: []
      - BearerAuth: []
      description: 'Requires authentication; roles: ORGANIZER, ADMIN.'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUrl:
                  type: string
                  format: uri
                  description: http(s); private, loopback and metadata addresses are rejected
                events:
                  type: array
                  items:
                    type: string
                    enum:
                    - TEAM_CREATED
                    - TEAM_JOINED
                    - PROJECT_SUBMITTED
                    - PROJECT_FINALIZED
                    - EVALUATION_SUBMITTED
                    - SCORES_NORMALIZED
                    - RESULTS_PUBLISHED
                    - VOTE_CAST
                    - CERTIFICATES_GENERATED
                    - EVENT_STATUS_UPDATED
                  minItems: 1
              required:
              - targetUrl
              - events
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
