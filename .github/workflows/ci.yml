name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dogfood_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dogfood_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/dogfood_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Unit tests (no database)
        run: npm test
      - name: Integration tests (PostgreSQL service)
        run: npm run test:integration

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build

  docker:
    name: Docker images + compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack (no .env, as on a fresh clone)
        run: docker compose up -d
      - name: Wait for the backend to become healthy
        run: |
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' dogfood_backend 2>/dev/null)" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          docker compose logs backend
          exit 1
      - name: Smoke test through the Nginx proxy
        run: |
          curl -fsS http://localhost:3000/api/health | grep -q healthy
          curl -fsS -o /dev/null http://localhost:3000/api/docs/
          curl -fsS -o /dev/null http://localhost:4000/api/docs/
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"organizer@dogfood.local","password":"Dogfood2026!"}' | grep -q '"success":true'
      - name: Data survives a backend restart
        run: |
          docker compose restart backend
          for i in $(seq 1 40); do curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break; sleep 3; done
          docker compose logs backend | grep -q "skipping demo data seed"
          curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"organizer@dogfood.local","password":"Dogfood2026!"}' | grep -q '"success":true'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
